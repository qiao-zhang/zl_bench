name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt ruff
      - name: Lint Python
        run: ruff check .
      - name: Lint shell
        run: shellcheck run_pytest.sh
      - name: Unit tests
        run: python -m pytest
